name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Debug info roughly doubles build size and time; CI only needs pass/fail.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  check:
    name: Format, Clippy, and tests
    # Windows is the game's development and target platform, and Bevy needs no
    # extra system packages there. Linux runners need ALSA and udev headers
    # from apt, which made the job depend on the Ubuntu mirrors being reachable.
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      # Check out the files byte-for-byte as committed.
      - name: Keep repository line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Tests with dev-tools
        run: cargo test --locked --features dev-tools
