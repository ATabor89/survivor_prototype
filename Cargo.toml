[package]
name = "survivors_prototype"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = "0.17"
bevy_rapier2d = { version = "0.32", features = ["debug-render-2d"] }
bevy_prototype_lyon = "0.15"
rand = "0.8.5"
strum = "0.26.3"
strum_macros = "0.26.4"
#bevy-panic-handler = "3.0.0"

# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3
